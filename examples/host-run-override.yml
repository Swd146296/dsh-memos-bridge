# Host-run endpoint override example.
#
# Copy this block into YOUR profile's cordis.patch.yml (applied after the
# bundle layer) when the MemOS LLM/embedding gateway is not reachable at the
# address the runner would pick — e.g. it lives on another machine, or only
# behind a local proxy rule. An id-targeted patch replaces the row's ENTIRE
# config, so every key is restated here.
#
# You usually do NOT need this file: the runner keeps real remote endpoints from
# MemOS's .env as-is, and only maps docker-internal hostnames to the published
# loopback port. See README "Endpoint resolution".
- id: memos-mcp
  config:
    transport: stdio
    serverName: memos
    command: 'C:/path/to/MemOS/.venv/Scripts/python.exe'
    args:
      - 'C:/path/to/dsh-memos-bridge/scripts/memos_mcp_runner.py'
    cwd: 'C:/path/to/MemOS'
    env:
      OPENAI_API_BASE: 'http://127.0.0.1:18181/v1'
      MOS_EMBEDDER_API_BASE: 'http://127.0.0.1:18182/compatible-mode/v1'
      MEMRADER_API_BASE: 'http://127.0.0.1:18181/v1'
      QWEN_API_BASE: 'http://127.0.0.1:18181/v1'
      # Keep the restated row UTF-8 clean as well (see cordis.patch.yml).
      PYTHONUTF8: '1'
      PYTHONIOENCODING: 'utf-8'
    toolCallTimeoutMs: 120000
    failOnStartupError: false
    reconnect:
      enabled: true
      initialDelayMs: 5000
      maxDelayMs: 30000
      maxAttempts: 100000

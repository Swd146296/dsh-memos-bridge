# Patch layer contributed by the dsh-memos-bridge bundle.
#
# Two rows:
#   1. `memos-bridge`  - this package's provider plugin; exposes `memosBridge`
#                        with the venv python, this package's MCP runner path,
#                        the MemOS working directory and the MCP namespace
#                        (all env-configurable).
#   2. `memos-mcp`     - one @deepseek-ai/dsh-mcp-client instance that spawns
#                        the MemOS MCP server over stdio via the runner. The
#                        runner preflights Neo4j (clear message + fast exit),
#                        warns on a missing LLM/embedding gateway, and resolves
#                        host-run endpoints.
#
# Environment knobs (read at mount time by the provider):
#   MEMOS_PYTHON      - python of the MemOS venv (default: python)
#   MEMOS_HOME        - MemOS repo directory used as the child cwd (default:
#                       the Harness process cwd). MemOS reads its .env from
#                       this directory, so set it unless MemOS is the launch
#                       directory.
#   MEMOS_MCP_SERVER  - serverName / tool namespace (default: memos). Must
#                       match [A-Za-z0-9_-]{1,32}.
#
# `cwd` is never empty: the MCP SDK forwards it to spawn() verbatim and an
# empty cwd fails with a bare ENOENT, so the provider always yields a real
# directory.
#
# Reconnect: handled by @deepseek-ai/dsh-mcp-client (0.2.x and newer). The
# runner exits fast with an actionable message when Neo4j is down, so starting
# the MemOS docker stack later recovers without a GUI restart. On older
# mcp-client versions (0.0.1-rc.x) the `reconnect` block is ignored and the
# row simply stays disconnected until the next reload.
- insert:
    - id: memos-bridge
      name: dsh-memos-bridge
    - id: memos-mcp
      name: '@deepseek-ai/dsh-mcp-client'
      inject: [memosBridge]
      config:
        transport: stdio
        serverName: !!js ctx.memosBridge.serverName
        command: !!js ctx.memosBridge.python
        args:
          - !!js ctx.memosBridge.runner
        cwd: !!js ctx.memosBridge.cwd
        # Memory writes and LLM-backed search/chat routinely exceed the 60 s
        # client default on a local gateway; MemOS itself has no per-call cap.
        toolCallTimeoutMs: 120000
        # UTF-8 for the child: a Windows console codepage (cp936/cp1252) turns
        # a non-ASCII log line into a UnicodeEncodeError inside the server.
        env:
          PYTHONUTF8: '1'
          PYTHONIOENCODING: 'utf-8'
        # Keep a downed MemOS from disabling the surrounding row set; the
        # reconnect policy brings the tools back once the stack is up.
        failOnStartupError: false
        reconnect:
          enabled: true
          initialDelayMs: 5000
          maxDelayMs: 30000
          maxAttempts: 100000
